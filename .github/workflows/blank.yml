name: Test
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-26-intel
          - macos-26
        repo:
          - 5527a0292e62299031937ff8360329f5aa5cc6e6 # master
          - b68fef8864695cb237304e46c71475cdf89674ce # mine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: jurplel/install-qt-action
          ref: ${{ matrix.repo }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: action/

      - run: |
          pushd action
          npm ci || npm install
          npm run build
          popd
          sed -i.bak 's|uses: $/action|uses: ./action|' action.yml
          diff -u action.yml.bak action.yml || true
          git status --porcelain
        shell: bash

      - name: Install Qt 5.15.2
        id: qt-5_15_2
        uses: ./
        with:
          version: 5.15.2
          target: android
          # aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Check Qt 5.15.2
        env:
          QT_PATH: '${{ steps.qt-5_15_2.outputs.qtPath }}'
        run: |
          printenv | sort

      - name: Install Qt 6.8.1
        id: qt-6_8_1
        uses: ./
        with:
          version: 6.8.1
          target: android
          # aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Check Qt 6.8.1
        env:
          QT_PATH: '${{ steps.qt-6_8_1.outputs.qtPath }}'
        run: |
          printenv | sort

      - name: Install Qt 6.8.3
        id: qt-6_8_3
        uses: ./
        with:
          version: 6.8.3
          target: android
          # aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Check Qt 6.8.3
        env:
          QT_PATH: '${{ steps.qt-6_8_3.outputs.qtPath }}'
        run: |
          printenv | sort

      - name: Inspect all
        run: |
          find ../Qt
        shell: bash
